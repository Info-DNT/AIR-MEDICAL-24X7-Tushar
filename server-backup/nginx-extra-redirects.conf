# =============================================================================
# BACKUP of the LIVE nginx redirects file on the AWS EC2 server
# Server file:  /etc/nginx/snippets/extra-redirects.conf
# Copied on:    2026-10-27 (exact copy; only these # comments were added)
#
# BACKUP ONLY - git pull does NOT apply it. It is loaded by the line
# "include snippets/extra-redirects.conf;" in nginx-live-default.conf.
#
# To restore: sudo nano /etc/nginx/snippets/extra-redirects.conf -> paste,
# then sudo nginx -t  and  sudo systemctl reload nginx
# =============================================================================

# /countries/ (with slash) -> /countries
location = /countries/ { return 301 https://airmedical24x7.com/countries; }
# Service pages wrongly opened under /blogs/ -> the real service page
location = /blogs/commercial-airlines-medical-transfer-services { return 301 https://airmedical24x7.com/airline-stretcher-services; }
location = /blogs/flight-medical-escort-services { return 301 https://airmedical24x7.com/flight-medical-escort-services; }
# Old Dubai cost page merged into the main Dubai page (added 2026-10-27)
location = /air-ambulance-cost-dubai { return 301 https://airmedical24x7.com/air-ambulance-dubai; }
