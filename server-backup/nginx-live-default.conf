# =============================================================================
# BACKUP of the LIVE nginx config on the AWS EC2 server
# Server file:  /etc/nginx/sites-available/default
# Copied on:    2026-10-27 (exact copy; only these # comments were added)
#
# This is a BACKUP ONLY. git pull does NOT apply it to nginx.
# Nginx reads /etc/nginx/..., not /var/www/html.
#
# To restore it on the server (only if the live file gets broken or lost):
#   1. sudo nano /etc/nginx/sites-available/default   -> paste this file
#   2. sudo nginx -t                                   -> must say "test is successful"
#   3. sudo systemctl reload nginx
#
# It also needs the second file: nginx-extra-redirects.conf (same folder).
#
# When you change the live file on the server, update this backup too.
#
# NOTE: "301" = permanent redirect (Google moves the old link's ranking to the new one).
#       "rewrite ... permanent" also does a 301 redirect.
# =============================================================================


# -----------------------------------------------------------------------------
# BLOCK 1: http://  ->  https://airmedical24x7.com
# Anyone opening the site without https (with or without www) is sent to the
# secure https version without www.
# -----------------------------------------------------------------------------
# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name airmedical24x7.com www.airmedical24x7.com;
    return 301 https://airmedical24x7.com$request_uri;
}

# -----------------------------------------------------------------------------
# BLOCK 2: https://www.airmedical24x7.com  ->  https://airmedical24x7.com
# Removes "www" so Google sees only one version of every page.
# The ssl_* lines are the SSL certificate (Let's Encrypt). Do not change them.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.airmedical24x7.com;
    ssl_certificate /etc/letsencrypt/live/airmedical24x7.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airmedical24x7.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://airmedical24x7.com$request_uri;
}

# -----------------------------------------------------------------------------
# BLOCK 3: the real website  https://airmedical24x7.com
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name airmedical24x7.com;
    ssl_certificate /etc/letsencrypt/live/airmedical24x7.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airmedical24x7.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Website files folder (the git clone) and the home page file.
    root /var/www/html;
    index index.html;

    # Speed (added 2026-10-27): HTTP/2 loads many files at once;
    # gzip shrinks CSS/JS/JSON/SVG before sending (HTML was already gzipped).
    http2 on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml text/plain image/svg+xml;

    # Security headers (protect against clickjacking, content sniffing, etc.).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Let's Encrypt needs this folder to renew the SSL certificate.
    location ~ /\.well-known/acme-challenge/ { allow all; }
    # Block hidden files like /.git and /.env (security).
    location ~ /\. { deny all; }

    # Extra redirects kept in a separate file:
    # /etc/nginx/snippets/extra-redirects.conf  (backup: nginx-extra-redirects.conf)
    include snippets/extra-redirects.conf;

    # --- Home page and clean URLs ------------------------------------------
    # "/" shows index.html; /index and /index.html go back to "/".
    location = / { try_files /index.html =404; }
    location = /index { return 301 /; }
    location = /index.html { return 301 /; }
    # /blogs/ , /blogs/index , /blogs/index.html  ->  /blogs
    location = /blogs/ { return 301 /blogs; }
    location = /blogs/index { return 301 /blogs; }
    location = /blogs/index.html { return 301 /blogs; }
    # Any /folder/index.html  ->  /folder
    location ~ ^(.+)/index\.html$ { return 301 $1; }
    # Old WordPress-era service pages  ->  new pages
    location = /services/air-ambulance-charters.html { return 301 https://airmedical24x7.com/air-ambulance; }
    location = /services/flight-medical-escort-service.html { return 301 https://airmedical24x7.com/flight-medical-escort-services; }
    # Remove ".html" from every URL:  /about-us.html  ->  /about-us
    location ~ ^(.+)\.html$ { return 301 $1; }

    # --- 404 page -----------------------------------------------------------
    # Unknown URLs show 404.html. Visitors can't open /404 directly.
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /404 { internal; }

    # --- Browser caching (speed) -----------------------------------------
    # CSS/JS/fonts cached 1 year (that's why we bump ?v= when they change).
    location ~* \.(css|js|woff2|woff|ttf|eot|otf)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    # Images cached 30 days.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|jfif)$ { expires 30d; add_header Cache-Control "public"; }

    # --- Ads landing pages + thank-you page --------------------------------
    # For /air-ambulance-xxx and /thank-you, nginx FIRST looks in the /ads/
    # folder (server-only ads pages), then falls back to the normal page.
    location ~* ^/(air-ambulance-.*|thank-you)$ { try_files /ads$uri.html $uri.html /ads$uri/index.html =404; }

    # --- Old / wrong URLs -> correct pages ------------------------------
    rewrite ^/ecmo-transfer$ /ECMO-transfer permanent;                        # lowercase -> real file name
    rewrite ^/contact$ /contact-us permanent;
    rewrite ^/contact/$ /contact-us permanent;
    rewrite ^/flight-medical-escort-service$ /flight-medical-escort-services permanent;   # missing "s"

    # --- Old blog links (/blog, /blog-detail ...) -> /blogs ----------------
    # Fix blog with any query string
    if ($uri = "/blog") { return 301 https://airmedical24x7.com/blogs; }
    if ($request_uri ~* "^/blog\?") { return 301 https://airmedical24x7.com/blogs; }
    rewrite ^/blog$ /blogs permanent;
    rewrite ^/blog-detail$ /blogs permanent;
    rewrite ^/blogs-detail$ /blogs permanent;

    # --- Old WordPress URLs -> new pages ---------------------------------
    rewrite ^/services$ /air-ambulance permanent;
    rewrite ^/services/contact-us$ /contact-us permanent;
    rewrite ^/services/flight-medical-escort-service\.html$ /flight-medical-escort-services permanent;
    rewrite ^/how-much-does-an-air-ambulance-cost/$ / permanent;
    rewrite ^/air-ambulance-services-manama/$ /air-ambulance permanent;
    rewrite ^/7-reasons-to-obtain-emergency-medical-services/feed/$ /air-ambulance permanent;
    rewrite ^/blog-detail\.html$ /blogs permanent;

    # NOTE: the next 9 lines never run. "rewrite" can't see the "?..." part of
    # a URL. The "if ($arg_slug ...)" blocks below do this job instead.
    # Kept here only because they are in the live file.
    rewrite ^/blog\?category=case-study$ /blogs permanent;
    rewrite ^/blog-detail\.html\?slug=medical-evacuation-bringing-your-loved-ones-home-safely$ /blogs/medical-evacuation-bringing-your-loved-ones-home-safely permanent;
    rewrite ^/blog-detail\.html\?slug=how-air-ambulance-services-speed-up-organ-transplants-and-emergency-medical-transfers$ /blogs/how-air-ambulance-services-speed-up-organ-transplants-and-emergency-medical-transfers permanent;
    rewrite ^/blog-detail\.html\?slug=a-high-risk-air-medical-mission-from-ras-al-khaimah-uae-to-assiut-egypt$ /blogs/a-high-risk-air-medical-mission-from-ras-al-khaimah-uae-to-assiut-egypt permanent;
    rewrite ^/blog-detail\.html\?slug=complete-guide-to-air-ambulance-services-in-dubai-and-uae$ /blogs permanent;
    rewrite ^/blog-detail\.html\?slug=air-medical-24x7-pediatric-air-medical-evacuation-from-sharjah-uae-to-addis-ababa-ethiopia$ /blogs permanent;
    rewrite ^/blog-detail\.html\?slug=24-7-international-air-ambulance-transfer-services-for-emergency-medical-transfer$ /blogs permanent;
    rewrite ^/blog-detail\.html\?slug=what-are-air-ambulance-services-and-how-do-they-work$ /blogs permanent;
    rewrite ^/blog-detail\.html\?slug=pediatric-air-ambulance-in-dubai$ /blogs permanent;

    # --- Old blog links with ?slug=... -------------------------------------
    # Any URL with ?slug=<old post> goes to the new blog page.
    # Posts that no longer exist go to /blogs.
    # Blog detail redirects with slug
    if ($arg_slug = "medical-evacuation-bringing-your-loved-ones-home-safely") {
        return 301 https://airmedical24x7.com/blogs/medical-evacuation-bringing-your-loved-ones-home-safely;
    }
    if ($arg_slug = "how-air-ambulance-services-speed-up-organ-transplants-and-emergency-medical-transfers") {
        return 301 https://airmedical24x7.com/blogs/how-air-ambulance-services-speed-up-organ-transplants-and-emergency-medical-transfers;
    }
    if ($arg_slug = "a-high-risk-air-medical-mission-from-ras-al-khaimah-uae-to-assiut-egypt") {
        return 301 https://airmedical24x7.com/blogs/a-high-risk-air-medical-mission-from-ras-al-khaimah-uae-to-assiut-egypt;
    }
    if ($arg_slug = "complete-guide-to-air-ambulance-services-in-dubai-and-uae") {
        return 301 https://airmedical24x7.com/blogs;
    }
    if ($arg_slug = "air-medical-24x7-pediatric-air-medical-evacuation-from-sharjah-uae-to-addis-ababa-ethiopia") {
        return 301 https://airmedical24x7.com/blogs;
    }
    if ($arg_slug = "24-7-international-air-ambulance-transfer-services-for-emergency-medical-transfer") {
        return 301 https://airmedical24x7.com/blogs;
    }
    if ($arg_slug = "what-are-air-ambulance-services-and-how-do-they-work") {
        return 301 https://airmedical24x7.com/blogs;
    }
    if ($arg_slug = "pediatric-air-ambulance-in-dubai") {
        return 301 https://airmedical24x7.com/blogs;
    }

    # Fix blog?category redirect - drop query param
    if ($request_uri ~* "^/blog(\?.*)?$") {
        return 301 https://airmedical24x7.com/blogs;
    }
    # Fix saudi arabia
    rewrite ^/air-ambulance-services-saudi-arabia/?$ /air-ambulance-saudi-arabia permanent;

    # --- More old URLs -> correct pages (one exact URL each) -------------
    location = /air-ambulance-charters { return 301 https://airmedical24x7.com/air-ambulance; }
    location = /blogs/terms-and-conditions { return 301 https://airmedical24x7.com/blogs; }
    location = /commercial-airlines-medical-transfer-services { return 301 https://airmedical24x7.com/airline-stretcher-services; }
    location = /blogs/hospital-acceptance { return 301 https://airmedical24x7.com/hospital-acceptance; }
    location = /how-to-book-a-commercial-stretcher-flight/ { return 301 https://airmedical24x7.com/airline-stretcher-services; }
    location = /flight-stretchers/ { return 301 https://airmedical24x7.com/airline-stretcher-services; }
    location = /air-ambulance-services-pakistan/ { return 301 https://airmedical24x7.com/air-ambulance; }
    location = /international-air-ambulance-flight-cost-in-2025/ { return 301 https://airmedical24x7.com/air-ambulance; }
    location = /air-ambulance-uaeAir { return 301 https://airmedical24x7.com/air-ambulance-uae; }
    location = /commercial-flight-with-wheelchair-facility/ { return 301 https://airmedical24x7.com/airline-stretcher-services; }
    if ($arg_slug = "how-air-ambulances-in-dubai-handle-international-patient-transfers") {
        return 301 https://airmedical24x7.com/blogs;
    }

    # --- Everything else: find the page file -----------------------------
    # /about-us -> about-us.html, then the exact file, then folder,
    # then /countries/... or /services/... version, else the 404 page.
    location / { try_files $uri.html $uri $uri/ /countries$uri.html /services$uri.html =404; }
}
