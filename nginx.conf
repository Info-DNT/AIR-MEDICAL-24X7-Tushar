# Air Medical 24X7 — Nginx Configuration Template for Clean URLs
# Copy the directives below into your Nginx server block (usually in /etc/nginx/sites-available/default)

# ── Canonical host: redirect www to non-www ───────────────────────
# Fixes duplicate-content issue: site was answering identically on
# www.airmedical24x7.com and airmedical24x7.com with no redirect.
# NOTE: if TLS is terminated here (not by a CDN/proxy in front), add the
# matching `listen 443 ssl;` + certificate directives to this block too.
server {
    listen 80;
    server_name www.airmedical24x7.com;
    return 301 https://airmedical24x7.com$request_uri;
}

server {
    listen 80;
    server_name airmedical24x7.com;
    root /var/www/html; # Update this path to match your project root folder on the server
    index index.html;

    # ── COMPRESSION ─────────────────────────────────────────────────
    # THIS IS THE SINGLE BIGGEST PERFORMANCE ITEM ON THIS SERVER.
    # Production was measured serving bootstrap.min.css as 199.9 KB of plain
    # text; gzip takes the same file to 23.8 KB. Across the CSS, HTML and JS on
    # one page load that is ~293 KB of avoidable transfer, on every visit.
    # Note: nginx never gzips an image or a woff2 — they are already compressed.
    gzip              on;
    gzip_vary         on;          # so caches key on Accept-Encoding
    gzip_comp_level   6;           # 6 is the cost/benefit knee; 9 costs CPU for ~1%
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # ── Security headers ────────────────────────────────────────────
    # NOTE: nginx's add_header does NOT inherit into a location block that
    # declares its own add_header. Both cache blocks below therefore repeat
    # these, otherwise every static asset ships with no security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Browser caching — static assets change rarely; let repeat
    #    visitors reuse their local copy instead of re-downloading ────
    location ~* \.(jpe?g|png|gif|webp|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # ── Block sensitive directories ──────────────────────────────────
    location ^~ /scratch/ {
        return 403;
    }

    # ── Admin panel (accessible but noindexed via meta tag) ─────────
    location ~* ^/admin/?$ {
        try_files /admin.html =404;
    }

    # ── 301: old /countries/air-ambulance-* → /air-ambulance-* ──────
    location ~ ^/countries/(air-ambulance-[^/]+)$ {
        return 301 /$1;
    }
    location ~ ^/countries/(air-ambulance-[^/]+)\.html$ {
        return 301 /$1;
    }

    # ── 301: redirect /countries/index to /countries ─────────────────
    location = /countries/index {
        return 301 /countries;
    }

    # ── 301: consolidated medical tourism redirects ──────────────────
    location = /custom-medical-packages {
        return 301 /medical-tourism;
    }
    location = /custom-medical-packages.html {
        return 301 /medical-tourism;
    }
    location = /medical-tourism-services {
        return 301 /medical-tourism;
    }
    location = /medical-tourism-services.html {
        return 301 /medical-tourism;
    }

    # ── Core routing: extensionless clean URLs ───────────────────────
    # Order: direct file → directory → .html at root → countries/.html → services/.html → 404
    location / {
        # Every page now lives at the site root, so no directory fallbacks are needed:
        # /air-ambulance-albania -> air-ambulance-albania.html
        try_files $uri $uri/ $uri.html =404;
    }

    # ── Redirect old /services/ paths to clean root-level URLs ─────────────
    location ~ ^/services/(?<service_page>[^/]+)$ {
        return 301 /$service_page;
    }

    location ~ ^/services/(?<service_page>[^/]+)\.html$ {
        return 301 /$service_page;
    }

    location ~ ^/(?<root_page>.+)\.html$ {
        if ($request_uri ~ \.html) {
            return 301 /$root_page;
        }
    }

    # ── Custom 404 page ──────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
