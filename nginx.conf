# Air Medical 24X7 — Nginx configuration
#
# ⚠️  DO NOT COPY THIS FILE OVER THE LIVE CONFIG BLINDLY.
#
# The four ssl_* lines below are PLACEHOLDERS. Copy the real ones out of the
# server's current working config first:
#
#     sudo nginx -T | grep -E 'ssl_certificate|ssl_dhparam|include /etc/letsencrypt'
#
# Replacing the live file while those lines are wrong takes HTTPS down for the
# whole site. `sudo nginx -t` catches it before a reload — always run it.
#
# Target file on the server is usually:  /etc/nginx/sites-available/default
#
# ─────────────────────────────────────────────────────────────────────────────
# THREE SERVER BLOCKS, one job each:
#   1. port 80        -> redirect everything to https://airmedical24x7.com
#   2. port 443 www   -> redirect to the non-www host
#   3. port 443 apex  -> actually serve the site
#
# Blocks 1 and 2 are what give the site a single canonical URL. Without block 2
# in particular, https://www... never redirects: the old config only listened on
# port 80, and since http already forwards to https, essentially no real traffic
# ever reached it.
# ─────────────────────────────────────────────────────────────────────────────


# ── 1. Everything on plain HTTP → HTTPS on the canonical host ────────────────
server {
    listen 80;
    server_name airmedical24x7.com www.airmedical24x7.com;

    # certbot's HTTP-01 challenge is fetched over plain HTTP and must not be
    # redirected away, or automatic certificate renewal fails silently.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;   # must match the webroot certbot was set up with
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://airmedical24x7.com$request_uri;
    }
}


# ── 2. HTTPS on www → HTTPS on the canonical host ────────────────────────────
# This block is the fix for "www does not redirect". The certificate already
# covers both names (verified: DNS:airmedical24x7.com, DNS:www.airmedical24x7.com),
# so no certificate work is needed — only this block.
server {
    listen 443 ssl;
    http2 on;
    server_name www.airmedical24x7.com;

    root /var/www/html;   # update if the real webroot differs

    # PLACEHOLDERS — replace with the real paths from `sudo nginx -T`
    ssl_certificate     /etc/letsencrypt/live/airmedical24x7.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airmedical24x7.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://airmedical24x7.com$request_uri;
}


# ── 3. The site ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name airmedical24x7.com;

    root /var/www/html;   # update if the real webroot differs
    index index.html;

    # PLACEHOLDERS — replace with the real paths from `sudo nginx -T`
    ssl_certificate     /etc/letsencrypt/live/airmedical24x7.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airmedical24x7.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── COMPRESSION ─────────────────────────────────────────────────
    # THIS IS THE SINGLE BIGGEST PERFORMANCE ITEM ON THIS SERVER.
    # Production was measured serving bootstrap.min.css as 199.9 KB of plain
    # text; gzip takes the same file to 23.8 KB. Across the CSS, HTML and JS on
    # one page load that is ~293 KB of avoidable transfer, on every visit.
    # Note: nginx never gzips an image or a woff2 — they are already compressed.
    gzip              on;
    gzip_vary         on;          # so caches key on Accept-Encoding
    gzip_comp_level   6;           # 6 is the cost/benefit knee; 9 costs CPU for ~1%
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # ── Security headers ────────────────────────────────────────────
    # NOTE: nginx's add_header does NOT inherit into a location block that
    # declares its own add_header. Both cache blocks below therefore repeat
    # these, otherwise every static asset ships with no security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ═════════════════════════════════════════════════════════════════
    #  ONE URL FOR THE HOMEPAGE
    # ═════════════════════════════════════════════════════════════════
    # The homepage answered on /, /index and /index.html — and again on www,
    # so six URLs for one page. These three blocks collapse that to one.
    #
    # ⚠️  `location = /` MUST use try_files, not the `index` directive.
    #     `index index.html` does not serve the file quietly: it issues an
    #     INTERNAL REDIRECT to /index.html, which re-enters location matching,
    #     hits the 301 below, bounces back to /, and loops forever. The homepage
    #     would die with ERR_TOO_MANY_REDIRECTS.
    #     try_files serves the file directly and never re-runs location matching.
    location = / {
        try_files /index.html =404;
    }
    location = /index {
        return 301 /;
    }
    location = /index.html {
        return 301 /;
    }

    # ── Browser caching — static assets change rarely; let repeat
    #    visitors reuse their local copy instead of re-downloading ────
    location ~* \.(jpe?g|png|gif|webp|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # ── Block sensitive directories ──────────────────────────────────
    location ^~ /scratch/ {
        return 403;
    }

    # ── Let's Encrypt renewal — MUST come before the dotfile deny ────
    # certbot's HTTP-01 challenge is served from /.well-known/acme-challenge/,
    # which the dotfile rule below would otherwise block. That failure is silent:
    # nothing breaks until the certificate quietly fails to renew and expires.
    # `^~` beats a regex location, so this wins regardless of ordering.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }

    # ── Never serve dotfiles ─────────────────────────────────────────
    # /.env and /.git/config are among the most-scanned paths on the web; bots
    # request them continuously. Nothing here needs to be reachable, and a plain
    # static server will happily serve them as text if asked.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Admin panel (accessible but noindexed via meta tag) ─────────
    location ~* ^/admin/?$ {
        try_files /admin.html =404;
    }

    # ── 301: old /countries/air-ambulance-* → /air-ambulance-* ──────
    location ~ ^/countries/(air-ambulance-[^/]+)$ {
        return 301 /$1;
    }
    location ~ ^/countries/(air-ambulance-[^/]+)\.html$ {
        return 301 /$1;
    }

    # ── 301: redirect /countries/index to /countries ─────────────────
    location = /countries/index {
        return 301 /countries;
    }

    # ── 301: UAE and Seychelles pages removed ────────────────────────
    # Both were live and indexed, so the old URLs redirect rather than 404.
    # UAE goes to united-arabs, which carries the same content; Seychelles has
    # no replacement, so it goes to the countries listing.
    location = /air-ambulance-uae {
        return 301 /united-arabs;
    }
    location = /air-ambulance-uae.html {
        return 301 /united-arabs;
    }
    location = /air-ambulance-seychelles {
        return 301 /countries;
    }
    location = /air-ambulance-seychelles.html {
        return 301 /countries;
    }

    # ── 301: the stretcher page renamed to match its own title ───────
    # Title, h1 and nav label had all said "Airline Stretcher Services" since
    # af54005, while the URL still said commercial-flight-stretcher — so hovering
    # the nav link showed a slug that matched nothing on the page. The URL now
    # agrees; this keeps the old one alive for anything already linking to it.
    location = /commercial-flight-stretcher {
        return 301 /airline-stretcher-services;
    }
    location = /commercial-flight-stretcher.html {
        return 301 /airline-stretcher-services;
    }

    # ── 301: consolidated medical tourism redirects ──────────────────
    location = /custom-medical-packages {
        return 301 /medical-tourism;
    }
    location = /custom-medical-packages.html {
        return 301 /medical-tourism;
    }
    location = /medical-tourism-services {
        return 301 /medical-tourism;
    }
    location = /medical-tourism-services.html {
        return 301 /medical-tourism;
    }

    # ── Clean blog post URLs ─────────────────────────────────────────
    # /blogs/<slug> is the URL the page writes into the address bar, so it is what gets
    # shared. Serve blogs-detail.html directly: the page reads the slug from the path.
    # Without this the request falls through to the 404 page, which redirects — the link
    # still works, but costs a hop and answers 404 to crawlers.
    location ~ ^/blogs/[^/]+/?$ {
        # Pre-rendered page first (tools/build-blog-pages.py), so crawlers get a 200 with
        # the article in the markup. A post published since the last build has no file
        # yet, so fall through to the client-rendered page, which reads the slug from the
        # path — the link works either way.
        try_files $uri.html /blogs-detail.html =404;
    }

    # ── Core routing: extensionless clean URLs ───────────────────────
    location / {
        # <path>.html is tried FIRST, before the directory. blogs.html and a blogs/
        # directory (the pre-rendered posts) both exist; with $uri first, nginx matched
        # the directory, 301'd to /blogs/ to add the trailing slash, found no index file
        # and returned 403 — so the blog listing was unreachable at its own canonical URL.
        # GitHub Pages resolves the same collision the other way, which is why it only
        # showed on production.
        try_files $uri.html $uri $uri/ =404;
    }

    # ── Redirect old /services/ paths to clean root-level URLs ─────────────
    location ~ ^/services/(?<service_page>[^/]+)$ {
        return 301 /$service_page;
    }

    location ~ ^/services/(?<service_page>[^/]+)\.html$ {
        return 301 /$service_page;
    }

    # Strip .html from any other page URL. The `if` guard is load-bearing: it
    # tests $request_uri, which keeps its original value through the internal
    # try_files rewrite above. Without it, /page -> (internal) /page.html would
    # re-match here and redirect in a loop.
    location ~ ^/(?<root_page>.+)\.html$ {
        if ($request_uri ~ \.html) {
            return 301 /$root_page;
        }
    }

    # A bare directory URL should be a 404, not nginx's branded 403 page. 403 tells a
    # crawler the resource exists but is withheld; 404 says it is not a page.
    autoindex off;
    location ~ ^/[^.]+/$ {
        return 404;
    }

    # ═════════════════════════════════════════════════════════════════
    #  THE CUSTOM 404 PAGE
    # ═════════════════════════════════════════════════════════════════
    # Without error_page, nginx answers an unknown URL with its own 162-byte
    # "404 Not Found" page and the site's 404.html is never reached. `internal`
    # stops both /404.html and /404 being fetched directly and answering 200 —
    # a 404 page that returns 200 is a soft-404, which Google penalises.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    location = /404 {
        internal;
    }
}
