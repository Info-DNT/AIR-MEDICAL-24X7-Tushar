# Air Medical 24X7 — Nginx Configuration Template for Clean URLs
# Copy the directives below into your Nginx server block (usually in /etc/nginx/sites-available/default)

# ── Canonical host: redirect www to non-www ───────────────────────
# Fixes duplicate-content issue: site was answering identically on
# www.airmedical24x7.com and airmedical24x7.com with no redirect.
# NOTE: if TLS is terminated here (not by a CDN/proxy in front), add the
# matching `listen 443 ssl;` + certificate directives to this block too.
server {
    listen 80;
    server_name www.airmedical24x7.com;
    return 301 https://airmedical24x7.com$request_uri;
}

server {
    listen 80;
    server_name airmedical24x7.com;
    root /var/www/html; # Update this path to match your project root folder on the server
    index index.html;

    # ── COMPRESSION ─────────────────────────────────────────────────
    # THIS IS THE SINGLE BIGGEST PERFORMANCE ITEM ON THIS SERVER.
    # Production was measured serving bootstrap.min.css as 199.9 KB of plain
    # text; gzip takes the same file to 23.8 KB. Across the CSS, HTML and JS on
    # one page load that is ~293 KB of avoidable transfer, on every visit.
    # Note: nginx never gzips an image or a woff2 — they are already compressed.
    gzip              on;
    gzip_vary         on;          # so caches key on Accept-Encoding
    gzip_comp_level   6;           # 6 is the cost/benefit knee; 9 costs CPU for ~1%
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # ── Security headers ────────────────────────────────────────────
    # NOTE: nginx's add_header does NOT inherit into a location block that
    # declares its own add_header. Both cache blocks below therefore repeat
    # these, otherwise every static asset ships with no security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Browser caching — static assets change rarely; let repeat
    #    visitors reuse their local copy instead of re-downloading ────
    location ~* \.(jpe?g|png|gif|webp|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # ── Block sensitive directories ──────────────────────────────────
    location ^~ /scratch/ {
        return 403;
    }

    # ── Let's Encrypt renewal — MUST come before the dotfile deny ────
    # certbot's HTTP-01 challenge is served from /.well-known/acme-challenge/,
    # which the dotfile rule below would otherwise block. That failure is silent:
    # nothing breaks until the certificate quietly fails to renew and expires.
    # `^~` beats a regex location, so this wins regardless of ordering.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }

    # ── Never serve dotfiles ─────────────────────────────────────────
    # /.env and /.git/config are among the most-scanned paths on the web; bots
    # request them continuously. Nothing here needs to be reachable, and a plain
    # static server will happily serve them as text if asked.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Admin panel (accessible but noindexed via meta tag) ─────────
    location ~* ^/admin/?$ {
        try_files /admin.html =404;
    }

    # ── 301: old /countries/air-ambulance-* → /air-ambulance-* ──────
    location ~ ^/countries/(air-ambulance-[^/]+)$ {
        return 301 /$1;
    }
    location ~ ^/countries/(air-ambulance-[^/]+)\.html$ {
        return 301 /$1;
    }

    # ── 301: redirect /countries/index to /countries ─────────────────
    location = /countries/index {
        return 301 /countries;
    }

    # ── 301: consolidated medical tourism redirects ──────────────────
    location = /custom-medical-packages {
        return 301 /medical-tourism;
    }
    location = /custom-medical-packages.html {
        return 301 /medical-tourism;
    }
    location = /medical-tourism-services {
        return 301 /medical-tourism;
    }
    location = /medical-tourism-services.html {
        return 301 /medical-tourism;
    }

    # ── Clean blog post URLs ─────────────────────────────────────────
    # /blogs/<slug> is the URL the page writes into the address bar, so it is what gets
    # shared. Serve blogs-detail.html directly: the page reads the slug from the path.
    # Without this the request falls through to the 404 page, which redirects — the link
    # still works, but costs a hop and answers 404 to crawlers.
    location ~ ^/blogs/[^/]+/?$ {
        # Pre-rendered page first (tools/build-blog-pages.py), so crawlers get a 200 with
        # the article in the markup. A post published since the last build has no file
        # yet, so fall through to the client-rendered page, which reads the slug from the
        # path — the link works either way.
        try_files $uri.html /blogs-detail.html =404;
    }

    # ── Core routing: extensionless clean URLs ───────────────────────
    # Order: direct file → directory → .html at root → countries/.html → services/.html → 404
    location / {
        # <path>.html is tried FIRST, before the directory. blogs.html and a blogs/
        # directory (the pre-rendered posts) both exist; with $uri first, nginx matched
        # the directory, 301'd to /blogs/ to add the trailing slash, found no index file
        # and returned 403 — so the blog listing was unreachable at its own canonical URL.
        # GitHub Pages resolves the same collision the other way, which is why it only
        # showed on production.
        try_files $uri.html $uri $uri/ =404;
    }

    # ── Redirect old /services/ paths to clean root-level URLs ─────────────
    location ~ ^/services/(?<service_page>[^/]+)$ {
        return 301 /$service_page;
    }

    location ~ ^/services/(?<service_page>[^/]+)\.html$ {
        return 301 /$service_page;
    }

    location ~ ^/(?<root_page>.+)\.html$ {
        if ($request_uri ~ \.html) {
            return 301 /$root_page;
        }
    }

    # A bare directory URL should be a 404, not nginx's branded 403 page. 403 tells a
    # crawler the resource exists but is withheld; 404 says it is not a page.
    autoindex off;
    location ~ ^/[^.]+/$ {
        return 404;
    }

    # ── Custom 404 page ──────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
